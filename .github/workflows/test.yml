name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 整形結果は ruff のバージョンに依存するため固定する。本リポは
      # plugins-weave/TelegramSecretary と同一コードの二重管理であり、両者を同じ版で
      # 揃えないと差分が出る。更新は「ruff を上げて ruff format を再適用する」commit として
      # 意図的に行う（自動追随させない）。
      - name: Install ruff
        run: pip install ruff==0.16.0

      # 検査ルールは pyproject.toml [tool.ruff.lint] select が SSoT（E4/E7/E9/F）。
      - name: Run ruff check
        run: ruff check .

      # 整形対象は Python ソースのみ（.md の除外は pyproject.toml [tool.ruff] が SSoT）。
      - name: Run ruff formatter check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # media / voice extras まで導入する。音声・文書アダプタのテストは実ライブラリを要し、
      # dev だけでは numpy 未導入で test_ffmpeg_preprocessor.py が collect error になる
      # （numpy は voice extras の av / moonshine-voice が連れてくる）。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,media,voice]"

      # coverage 閾値は pyproject.toml [tool.coverage.report] fail_under = 70 が SSoT。
      - name: Run tests with coverage
        run: python -m pytest -v --cov
